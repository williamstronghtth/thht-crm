<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THHT CRM Login</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background: #fff; color: #111827; }
    .page { min-height: 100vh; display: flex; flex-direction: column; }
    .header { padding: 24px 40px; }
    .brand { font-weight: 700; font-size: 18px; }
    .center { flex: 1; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width: 100%; max-width: 380px; }
    h1 { font-size: 28px; margin: 0 0 8px; text-align:center; }
    p { color:#6b7280; text-align:center; margin: 0 0 24px; }
    label { display:block; font-size:14px; font-weight:600; margin-bottom:6px; }
    input { width:100%; padding: 12px 14px; border:1px solid #d1d5db; border-radius:10px; margin-bottom:16px; font-size:15px; }
    button { width:100%; padding:12px 14px; background:#111827; color:#fff; border:0; border-radius:10px; font-weight:600; cursor:pointer; }
    .error { display:none; color:#b91c1c; background:#fee2e2; padding:10px 12px; border-radius:10px; margin-bottom:16px; font-size:14px; }
    .footer { text-align:center; color:#9ca3af; font-size:13px; margin-top:18px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header"><div class="brand">The Hoover Home Team</div></div>
    <div class="center">
      <div class="card">
        <h1>Sign in</h1>
        <p>Access the THHT CRM workspace</p>
        <div id="error" class="error"></div>
        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autocomplete="username" />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" />
          <button type="submit">Sign In</button>
        </form>
        <div class="footer">Team access for Chris, William, and Jack</div>
      </div>
    </div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = document.getElementById('error');
      error.style.display = 'none';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) {
        error.textContent = data.error || 'Login failed';
        error.style.display = 'block';
        return;
      }
      window.location.href = '/';
    });
  </script>
</body>
</html>
