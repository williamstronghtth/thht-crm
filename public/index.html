<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THHT CRM — The Hoover Home Team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/jpeg" href="/logo.jpg">
<style>
:root {
  --bg: #0f172a;
  --surface: #1e293b;
  --surface-hover: #334155;
  --border: #334155;
  --text: #f1f5f9;
  --text-muted: #94a3b8;
  --accent: #3b82f6;
  --accent-hover: #2563eb;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --purple: #8b5cf6;
  --cyan: #06b6d4;
  --shadow: 0 4px 12px rgba(0,0,0,0.3);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* Header */
.header {
  background: var(--surface);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  border-bottom: 1px solid var(--border);
}
.header-left { display: flex; align-items: center; gap: 12px; }
.header-left img { height: 36px; width: 36px; border-radius: 6px; object-fit: cover; }
.header h1 { font-size: 20px; font-weight: 600; }
.header h1 span { font-size: 14px; color: var(--text-muted); font-weight: 400; display: block; }

/* Nav Tabs */
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-muted);
  transition: all 0.15s;
  border: 1px solid var(--border);
  background: transparent;
  font-family: inherit;
}
.nav-tab:hover { background: var(--surface-hover); color: var(--text); }
.nav-tab.active { background: var(--accent); color: white; border-color: var(--accent); }

/* Main Content */
.main { max-width: 1400px; margin: 0 auto; padding: 20px; }

/* Dashboard Stats */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 20px;
  border: 1px solid var(--border);
  text-align: center;
}
.stat-number { font-size: 36px; font-weight: 700; color: var(--accent); }
.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.stat-card.alert .stat-number { color: var(--danger); }
.stat-card.success .stat-number { color: var(--success); }

/* Pipeline */
.pipeline {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.pipeline-col {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  border: 1px solid var(--border);
  min-height: 200px;
}
.pipeline-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.pipeline-title { font-weight: 600; font-size: 14px; }
.pipeline-count {
  background: var(--bg);
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
}
.stage-lead .pipeline-header { border-color: var(--accent); }
.stage-active .pipeline-header { border-color: var(--success); }
.stage-contract .pipeline-header { border-color: var(--warning); }
.stage-closed .pipeline-header { border-color: var(--purple); }
.stage-past .pipeline-header { border-color: var(--text-muted); }

.pipeline-card {
  background: var(--bg);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.15s;
  border-left: 3px solid transparent;
  border: 1px solid var(--border);
}
.pipeline-card:hover { background: var(--surface-hover); transform: translateY(-1px); }
.pipeline-card .name { font-weight: 600; font-size: 14px; }
.pipeline-card .source-tag {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--accent);
  color: white;
  display: inline-block;
  margin-top: 6px;
}
.pipeline-card.has-followup { border-left: 3px solid var(--warning); }
.pipeline-card.overdue { border-left: 3px solid var(--danger); }

/* Toolbar */
.toolbar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.search-box {
  flex: 1;
  min-width: 200px;
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  background: var(--surface);
  color: var(--text);
  transition: border-color 0.15s;
}
.search-box:focus { border-color: var(--accent); }
.search-box::placeholder { color: var(--text-muted); }
.filter-select {
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: var(--surface);
  color: var(--text);
  cursor: pointer;
  outline: none;
}
.filter-select:focus { border-color: var(--accent); }
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-success { background: var(--success); color: white; }
.btn-danger { background: var(--danger); color: white; }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
.btn-outline:hover { background: var(--surface-hover); border-color: var(--accent); }
.btn-sm { padding: 6px 12px; font-size: 13px; }

/* Contact Table */
.contact-table {
  width: 100%;
  background: var(--surface);
  border-radius: 12px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.contact-table table { width: 100%; border-collapse: collapse; }
.contact-table th {
  background: var(--bg);
  color: var(--text);
  padding: 12px 16px;
  text-align: left;
  font-size: 13px;
  font-weight: 600;
  border-bottom: 1px solid var(--border);
}
.contact-table td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  color: var(--text);
}
.contact-table tr:hover td { background: var(--surface-hover); }
.contact-table tr { cursor: pointer; }

.stage-badge {
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
}
.stage-badge.lead { background: rgba(59,130,246,0.2); color: var(--accent); }
.stage-badge.active { background: rgba(34,197,94,0.2); color: var(--success); }
.stage-badge.contract { background: rgba(245,158,11,0.2); color: var(--warning); }
.stage-badge.closed { background: rgba(139,92,246,0.2); color: var(--purple); }
.stage-badge.past { background: rgba(148,163,184,0.2); color: var(--text-muted); }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface);
  border-radius: 16px;
  width: 100%;
  max-width: 700px;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow);
  border: 1px solid var(--border);
}
.modal-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: var(--surface);
  border-radius: 16px 16px 0 0;
  z-index: 1;
}
.modal-header h2 { font-size: 20px; font-weight: 600; }
.modal-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); padding: 4px 8px; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 24px; }
.modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.form-group { margin-bottom: 16px; }
.form-group.full { grid-column: 1 / -1; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  background: var(--bg);
  color: var(--text);
  transition: border-color 0.15s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent); }
.form-group textarea { resize: vertical; min-height: 80px; }
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--text-muted); }

/* Activity Log */
.activity-log { margin-top: 20px; }
.activity-log h3 { font-size: 16px; margin-bottom: 12px; color: var(--text); }
.activity-item {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.activity-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  margin-top: 5px;
  flex-shrink: 0;
}
.activity-time { color: var(--text-muted); font-size: 12px; }
.add-activity { display: flex; gap: 8px; margin-top: 12px; }
.add-activity input { flex: 1; }

/* Section Headers */
.section-header {
  color: var(--text);
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Hidden sections */
.view { display: none; }
.view.active { display: block; }

/* Recent Activity Card */
.activity-card {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px;
  border: 1px solid var(--border);
}

/* Responsive */
@media (max-width: 768px) {
  .pipeline { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .nav-tabs { display: none; }
  .header { flex-direction: column; gap: 12px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .contact-table { overflow-x: auto; }
}
@media (max-width: 1200px) {
  .pipeline { grid-template-columns: repeat(3, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="/logo.jpg" alt="THHT">
    <h1>THHT CRM <span>The Hoover Home Team</span></h1>
  </div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="switchView('dashboard')">📊 Dashboard</button>
    <button class="nav-tab" onclick="switchView('pipeline')">🔄 Pipeline</button>
    <button class="nav-tab" onclick="switchView('contacts')">👥 Contacts</button>
    <button class="nav-tab" onclick="switchView('followups')">🔔 Follow-Ups</button>
  </div>
</div>

<div class="main">
  <!-- Dashboard View -->
  <div id="view-dashboard" class="view active">
    <div class="stats-grid" id="stats-grid"></div>
    <div class="section-header">📈 Pipeline Overview</div>
    <div class="pipeline" id="dashboard-pipeline"></div>
    <div class="section-header" style="margin-top:24px;">🕐 Recent Activity</div>
    <div id="recent-activity" class="activity-card"></div>
  </div>

  <!-- Pipeline View -->
  <div id="view-pipeline" class="view">
    <div class="pipeline" id="pipeline-view"></div>
  </div>

  <!-- Contacts View -->
  <div id="view-contacts" class="view">
    <div class="toolbar">
      <input type="text" class="search-box" id="search-input" placeholder="🔍 Search contacts..." oninput="loadContacts()">
      <select class="filter-select" id="filter-stage" onchange="loadContacts()">
        <option value="all">All Stages</option>
        <option value="lead">Lead</option>
        <option value="active">Active</option>
        <option value="contract">Contract</option>
        <option value="closed">Closed</option>
        <option value="past">Past Client</option>
      </select>
      <select class="filter-select" id="filter-source" onchange="loadContacts()">
        <option value="all">All Sources</option>
      </select>
      <button class="btn btn-primary" onclick="openNewContact()">+ Add Contact</button>
      <a href="/api/export" class="btn btn-outline">⬇ Export</a>
    </div>
    <div class="contact-table" id="contact-table"></div>
  </div>

  <!-- Follow-Ups View -->
  <div id="view-followups" class="view">
    <div class="toolbar">
      <select class="filter-select" id="filter-followup" onchange="loadFollowups()">
        <option value="overdue">⚠️ Overdue</option>
        <option value="upcoming">📅 This Week</option>
        <option value="all">📋 All Scheduled</option>
      </select>
    </div>
    <div class="contact-table" id="followup-table"></div>
  </div>
</div>

<!-- Contact Modal -->
<div class="modal-overlay" id="contact-modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Contact Details</h2>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="f-first" placeholder="First name">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="f-last" placeholder="Last name">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="f-email" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="tel" id="f-phone" placeholder="(386) 555-1234">
        </div>
        <div class="form-group full">
          <label>Address</label>
          <input type="text" id="f-address" placeholder="Full address">
        </div>
        <div class="form-group">
          <label>Source</label>
          <select id="f-source">
            <option value="">Select source...</option>
            <option value="Cold Calling">Cold Calling</option>
            <option value="Door Knocking">Door Knocking</option>
            <option value="Sold.com">Sold.com</option>
            <option value="Close AI">Close AI</option>
            <option value="Opcity">Opcity</option>
            <option value="Qazzoo">Qazzoo</option>
            <option value="KvCORE">KvCORE</option>
            <option value="CB Lead">CB Lead</option>
            <option value="Open House">Open House</option>
            <option value="EDDM">EDDM</option>
            <option value="Website">Website</option>
            <option value="Referral">Referral</option>
            <option value="Letter">Letter</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Stage</label>
          <select id="f-stage">
            <option value="lead">Lead</option>
            <option value="active">Active</option>
            <option value="contract">Contract</option>
            <option value="closed">Closed</option>
            <option value="past">Past Client</option>
          </select>
        </div>
        <div class="form-group">
          <label>Follow-Up Date</label>
          <input type="date" id="f-followup-date">
        </div>
        <div class="form-group">
          <label>Follow-Up Note</label>
          <input type="text" id="f-followup-note" placeholder="What to follow up on...">
        </div>
        <div class="form-group full">
          <label>Notes</label>
          <textarea id="f-notes" rows="4" placeholder="Notes about this contact..."></textarea>
        </div>
      </div>

      <div class="activity-log" id="activity-section" style="display:none;">
        <h3>Activity Log</h3>
        <div class="add-activity">
          <input type="text" id="new-activity" placeholder="Add a note or activity..." class="search-box" style="min-width:0;">
          <select id="activity-type" class="filter-select" style="min-width:auto;">
            <option value="note">📝 Note</option>
            <option value="call">📞 Call</option>
            <option value="email">📧 Email</option>
            <option value="meeting">🤝 Meeting</option>
            <option value="letter">✉️ Letter</option>
            <option value="showing">🏠 Showing</option>
          </select>
          <button class="btn btn-primary btn-sm" onclick="addActivity()">Add</button>
        </div>
        <div id="activity-list" style="margin-top:12px;"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="delete-btn" onclick="deleteContact()" style="margin-right:auto;display:none;">Delete</button>
      <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveContact()">Save</button>
    </div>
  </div>
</div>

<script>
let currentContactId = null;
let allContacts = [];

// View switching
function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  event.target.classList.add('active');
  
  if (view === 'dashboard') loadDashboard();
  else if (view === 'pipeline') loadPipeline();
  else if (view === 'contacts') loadContacts();
  else if (view === 'followups') loadFollowups();
}

// Dashboard
async function loadDashboard() {
  const stats = await fetch('/api/stats').then(r => r.json());
  
  const stages = { lead: 'Leads', active: 'Active', contract: 'Contract', closed: 'Closed', past: 'Past' };
  
  document.getElementById('stats-grid').innerHTML = `
    <div class="stat-card"><div class="stat-number">${stats.total}</div><div class="stat-label">Total Contacts</div></div>
    <div class="stat-card success"><div class="stat-number">${stats.withEmail}</div><div class="stat-label">With Email</div></div>
    <div class="stat-card"><div class="stat-number">${stats.withPhone}</div><div class="stat-label">With Phone</div></div>
    <div class="stat-card ${stats.overdueFollowups > 0 ? 'alert' : ''}"><div class="stat-number">${stats.overdueFollowups}</div><div class="stat-label">Overdue</div></div>
    <div class="stat-card"><div class="stat-number">${stats.upcomingFollowups}</div><div class="stat-label">This Week</div></div>
    ${Object.entries(stages).map(([k,v]) => `
      <div class="stat-card"><div class="stat-number">${stats.stages[k] || 0}</div><div class="stat-label">${v}</div></div>
    `).join('')}
  `;

  const contacts = await fetch('/api/contacts').then(r => r.json());
  renderPipeline('dashboard-pipeline', contacts, 3);

  document.getElementById('recent-activity').innerHTML = stats.recentActivity.length === 0 
    ? '<p style="color:var(--text-muted);">No recent activity</p>'
    : stats.recentActivity.slice(0, 5).map(a => `
      <div class="activity-item">
        <div class="activity-dot"></div>
        <div>
          <strong>${a.first_name} ${a.last_name}</strong> — ${a.description}
          <div class="activity-time">${new Date(a.created_at).toLocaleString()}</div>
        </div>
      </div>
    `).join('');
}

// Pipeline
async function loadPipeline() {
  const contacts = await fetch('/api/contacts').then(r => r.json());
  renderPipeline('pipeline-view', contacts, 50);
}

function renderPipeline(containerId, contacts, limit) {
  const stageConfig = [
    { key: 'lead', label: '🎯 Leads', cls: 'stage-lead' },
    { key: 'active', label: '🔥 Active', cls: 'stage-active' },
    { key: 'contract', label: '📝 Contract', cls: 'stage-contract' },
    { key: 'closed', label: '🎉 Closed', cls: 'stage-closed' },
    { key: 'past', label: '📁 Past', cls: 'stage-past' },
  ];

  const now = new Date().toISOString().split('T')[0];

  document.getElementById(containerId).innerHTML = stageConfig.map(s => {
    const stageContacts = contacts.filter(c => c.stage === s.key).slice(0, limit);
    const total = contacts.filter(c => c.stage === s.key).length;
    return `
      <div class="pipeline-col ${s.cls}">
        <div class="pipeline-header">
          <span class="pipeline-title">${s.label}</span>
          <span class="pipeline-count">${total}</span>
        </div>
        ${stageContacts.map(c => {
          const isOverdue = c.follow_up_date && c.follow_up_date <= now;
          const hasFU = c.follow_up_date && !isOverdue;
          return `
            <div class="pipeline-card ${isOverdue ? 'overdue' : hasFU ? 'has-followup' : ''}" onclick="openContact(${c.id})">
              <div class="name">${c.first_name} ${c.last_name}</div>
              ${c.source ? `<span class="source-tag">${c.source}</span>` : ''}
              ${isOverdue ? '<div style="color:var(--danger);font-size:11px;margin-top:4px;">⚠️ Follow-up overdue</div>' : ''}
            </div>
          `;
        }).join('')}
        ${total > limit ? `<div style="text-align:center;color:var(--text-muted);font-size:13px;margin-top:8px;">+${total - limit} more</div>` : ''}
      </div>
    `;
  }).join('');
}

// Contacts List
async function loadContacts() {
  const search = document.getElementById('search-input').value;
  const stage = document.getElementById('filter-stage').value;
  const source = document.getElementById('filter-source').value;
  
  const params = new URLSearchParams();
  if (search) params.set('search', search);
  if (stage !== 'all') params.set('stage', stage);
  if (source !== 'all') params.set('source', source);

  const contacts = await fetch(`/api/contacts?${params}`).then(r => r.json());
  allContacts = contacts;

  document.getElementById('contact-table').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Source</th>
          <th>Stage</th>
          <th>Follow-Up</th>
        </tr>
      </thead>
      <tbody>
        ${contacts.length === 0 ? '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:40px;">No contacts found</td></tr>' : ''}
        ${contacts.map(c => `
          <tr onclick="openContact(${c.id})">
            <td><strong>${c.first_name} ${c.last_name}</strong></td>
            <td>${c.phone || '—'}</td>
            <td>${c.email || '—'}</td>
            <td>${c.source || '—'}</td>
            <td><span class="stage-badge ${c.stage}">${c.stage}</span></td>
            <td>${c.follow_up_date || '—'}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
    <div style="padding:12px 16px;color:var(--text-muted);font-size:13px;">${contacts.length} contact${contacts.length !== 1 ? 's' : ''}</div>
  `;
}

// Follow-ups
async function loadFollowups() {
  const filter = document.getElementById('filter-followup').value;
  const contacts = await fetch(`/api/contacts?followup=${filter}`).then(r => r.json());

  document.getElementById('followup-table').innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Follow-Up Date</th>
          <th>Note</th>
          <th>Phone</th>
          <th>Stage</th>
        </tr>
      </thead>
      <tbody>
        ${contacts.length === 0 ? '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:40px;">No follow-ups found 🎉</td></tr>' : ''}
        ${contacts.map(c => `
          <tr onclick="openContact(${c.id})">
            <td><strong>${c.first_name} ${c.last_name}</strong></td>
            <td style="color:${c.follow_up_date <= new Date().toISOString().split('T')[0] ? 'var(--danger)' : 'inherit'}">${c.follow_up_date}</td>
            <td>${c.follow_up_note || c.notes?.substring(0, 60) || '—'}</td>
            <td>${c.phone || '—'}</td>
            <td><span class="stage-badge ${c.stage}">${c.stage}</span></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

// Modal
function openNewContact() {
  currentContactId = null;
  document.getElementById('modal-title').textContent = 'New Contact';
  document.getElementById('delete-btn').style.display = 'none';
  document.getElementById('activity-section').style.display = 'none';
  clearForm();
  document.getElementById('contact-modal').classList.add('active');
}

async function openContact(id) {
  currentContactId = id;
  const data = await fetch(`/api/contacts/${id}`).then(r => r.json());
  
  document.getElementById('modal-title').textContent = `${data.first_name} ${data.last_name}`;
  document.getElementById('delete-btn').style.display = 'block';
  document.getElementById('activity-section').style.display = 'block';
  
  document.getElementById('f-first').value = data.first_name || '';
  document.getElementById('f-last').value = data.last_name || '';
  document.getElementById('f-email').value = data.email || '';
  document.getElementById('f-phone').value = data.phone || '';
  document.getElementById('f-address').value = data.address || '';
  document.getElementById('f-source').value = data.source || '';
  document.getElementById('f-stage').value = data.stage || 'lead';
  document.getElementById('f-notes').value = data.notes || '';
  document.getElementById('f-followup-date').value = data.follow_up_date || '';
  document.getElementById('f-followup-note').value = data.follow_up_note || '';

  const typeIcons = { note: '📝', call: '📞', email: '📧', meeting: '🤝', letter: '✉️', showing: '🏠', created: '✨', imported: '📥', stage_change: '🔄' };
  document.getElementById('activity-list').innerHTML = (data.activities || []).map(a => `
    <div class="activity-item">
      <div class="activity-dot"></div>
      <div>
        <strong>${typeIcons[a.type] || '📌'} ${a.type}</strong> — ${a.description}
        <div class="activity-time">${new Date(a.created_at).toLocaleString()}</div>
      </div>
    </div>
  `).join('') || '<p style="color:var(--text-muted);">No activities yet</p>';

  document.getElementById('contact-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('contact-modal').classList.remove('active');
  currentContactId = null;
}

function clearForm() {
  ['f-first','f-last','f-email','f-phone','f-address','f-notes','f-followup-date','f-followup-note'].forEach(id => 
    document.getElementById(id).value = '');
  document.getElementById('f-source').value = '';
  document.getElementById('f-stage').value = 'lead';
}

async function saveContact() {
  const data = {
    first_name: document.getElementById('f-first').value,
    last_name: document.getElementById('f-last').value,
    email: document.getElementById('f-email').value,
    phone: document.getElementById('f-phone').value,
    address: document.getElementById('f-address').value,
    source: document.getElementById('f-source').value,
    stage: document.getElementById('f-stage').value,
    notes: document.getElementById('f-notes').value,
    follow_up_date: document.getElementById('f-followup-date').value,
    follow_up_note: document.getElementById('f-followup-note').value,
  };

  const url = currentContactId ? `/api/contacts/${currentContactId}` : '/api/contacts';
  const method = currentContactId ? 'PUT' : 'POST';

  await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  closeModal();
  refreshCurrentView();
}

async function deleteContact() {
  if (!currentContactId || !confirm('Delete this contact?')) return;
  await fetch(`/api/contacts/${currentContactId}`, { method: 'DELETE' });
  closeModal();
  refreshCurrentView();
}

async function addActivity() {
  if (!currentContactId) return;
  const desc = document.getElementById('new-activity').value;
  if (!desc) return;
  const type = document.getElementById('activity-type').value;
  
  await fetch(`/api/contacts/${currentContactId}/activities`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ type, description: desc })
  });
  
  document.getElementById('new-activity').value = '';
  openContact(currentContactId);
}

function refreshCurrentView() {
  const activeView = document.querySelector('.view.active')?.id?.replace('view-', '');
  if (activeView === 'dashboard') loadDashboard();
  else if (activeView === 'pipeline') loadPipeline();
  else if (activeView === 'contacts') loadContacts();
  else if (activeView === 'followups') loadFollowups();
}

async function loadSourceOptions() {
  const stats = await fetch('/api/stats').then(r => r.json());
  const sel = document.getElementById('filter-source');
  sel.innerHTML = '<option value="all">All Sources</option>' +
    stats.sources.map(s => `<option value="${s.source}">${s.source} (${s.count})</option>`).join('');
}

document.getElementById('contact-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

loadDashboard();
loadSourceOptions();
</script>
</body>
</html>
