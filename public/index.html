<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THHT CRM — The Hoover Home Team</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Jost', sans-serif; background: #f5f7fa; color: #333; }
    
    /* Header */
    .header { background: #1a1a2e; color: white; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
    .header-left { display: flex; align-items: center; gap: 16px; }
    .header h1 { font-size: 22px; font-weight: 600; }
    .header h1 span { color: #e8b931; }
    .header-stats { display: flex; gap: 20px; font-size: 14px; }
    .header-stat { text-align: center; }
    .header-stat .num { font-size: 24px; font-weight: 700; color: #e8b931; }
    .header-stat .label { opacity: 0.7; font-size: 12px; }
    
    /* Layout */
    .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
    
    /* Toolbar */
    .toolbar { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .toolbar input[type="text"] { padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'Jost'; width: 280px; }
    .toolbar select { padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; font-family: 'Jost'; background: white; }
    .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-family: 'Jost'; font-size: 14px; font-weight: 500; transition: all 0.2s; }
    .btn-primary { background: #1a1a2e; color: white; }
    .btn-primary:hover { background: #2d2d4e; }
    .btn-gold { background: #e8b931; color: #1a1a2e; }
    .btn-gold:hover { background: #d4a82a; }
    .btn-danger { background: #e74c3c; color: white; }
    .btn-danger:hover { background: #c0392b; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-outline { background: transparent; border: 1px solid #ddd; color: #666; }
    .btn-outline:hover { border-color: #1a1a2e; color: #1a1a2e; }
    
    /* Pipeline View */
    .pipeline { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 20px; }
    .pipeline-stage { flex: 0 0 auto; padding: 10px 18px; border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; background: white; border: 2px solid #e0e0e0; transition: all 0.2s; }
    .pipeline-stage:hover { border-color: #1a1a2e; }
    .pipeline-stage.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
    .pipeline-stage .count { display: inline-block; background: rgba(232,185,49,0.2); color: #b8941e; padding: 2px 8px; border-radius: 10px; margin-left: 6px; font-size: 11px; font-weight: 700; }
    .pipeline-stage.active .count { background: rgba(232,185,49,0.3); color: #e8b931; }
    
    /* Client Table */
    .client-table { width: 100%; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .client-table table { width: 100%; border-collapse: collapse; }
    .client-table th { background: #f8f9fa; padding: 12px 16px; text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #888; border-bottom: 2px solid #eee; }
    .client-table td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
    .client-table tr:hover { background: #fafbfc; cursor: pointer; }
    .client-name { font-weight: 600; color: #1a1a2e; }
    .stage-badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
    .stage-Lead { background: #e3f2fd; color: #1565c0; }
    .stage-Active-Buyer, .stage-Active-Seller { background: #fff3e0; color: #e65100; }
    .stage-Under-Contract { background: #f3e5f5; color: #7b1fa2; }
    .stage-Closed { background: #e8f5e9; color: #2e7d32; }
    .stage-Past-Client { background: #f5f5f5; color: #616161; }
    .follow-up-flag { color: #e74c3c; font-weight: 600; font-size: 12px; }
    .no-clients { text-align: center; padding: 60px 20px; color: #999; }
    .no-clients h3 { font-size: 18px; margin-bottom: 8px; }
    
    /* Modal */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: white; border-radius: 16px; padding: 28px; width: 600px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
    .modal h2 { font-size: 20px; margin-bottom: 20px; color: #1a1a2e; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; color: #888; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Jost'; font-size: 14px; }
    .form-group textarea { height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    
    /* Client Detail */
    .detail-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px; }
    .detail-header h2 { font-size: 24px; }
    .detail-info { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .detail-info .info-item { font-size: 14px; }
    .detail-info .info-label { color: #888; font-size: 12px; }
    
    /* Activity Feed */
    .activity-section { margin-top: 24px; }
    .activity-section h3 { font-size: 16px; margin-bottom: 12px; }
    .activity-form { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .activity-form select { width: 140px; }
    .activity-form input { flex: 1; min-width: 200px; }
    .activity-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f0f0; align-items: start; }
    .activity-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    .activity-icon.Call { background: #e3f2fd; }
    .activity-icon.Email { background: #fff3e0; }
    .activity-icon.Text { background: #e8f5e9; }
    .activity-icon.Showing { background: #f3e5f5; }
    .activity-icon.Meeting { background: #fce4ec; }
    .activity-icon.Note { background: #f5f5f5; }
    .activity-icon.Follow-up { background: #fff8e1; }
    .activity-content { flex: 1; }
    .activity-content .type { font-weight: 600; font-size: 13px; }
    .activity-content .desc { font-size: 14px; color: #555; }
    .activity-content .date { font-size: 11px; color: #aaa; }
    .activity-delete { cursor: pointer; color: #ccc; font-size: 12px; }
    .activity-delete:hover { color: #e74c3c; }
    
    @media (max-width: 768px) {
      .toolbar { flex-direction: column; }
      .toolbar input[type="text"] { width: 100%; }
      .form-row { grid-template-columns: 1fr; }
      .detail-info { grid-template-columns: 1fr; }
      .header { flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <h1>🏠 <span>THHT</span> CRM</h1>
    </div>
    <div class="header-stats" id="headerStats"></div>
  </div>
  
  <div class="container">
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Search clients..." oninput="renderClients()">
      <select id="stageFilter" onchange="renderClients()">
        <option value="">All Stages</option>
      </select>
      <select id="sortBy" onchange="renderClients()">
        <option value="name">Sort by Name</option>
        <option value="lastContact">Sort by Last Contact</option>
        <option value="stage">Sort by Stage</option>
        <option value="created">Sort by Date Added</option>
      </select>
      <div style="flex:1"></div>
      <button class="btn btn-gold" onclick="openAddModal()">+ Add Client</button>
    </div>
    
    <div class="pipeline" id="pipeline"></div>
    
    <div class="client-table" id="clientTable"></div>
  </div>
  
  <!-- Add/Edit Client Modal -->
  <div class="modal-overlay" id="clientModal">
    <div class="modal">
      <h2 id="modalTitle">Add Client</h2>
      <input type="hidden" id="editClientId">
      <div class="form-row">
        <div class="form-group">
          <label>Name</label>
          <input type="text" id="clientName" placeholder="Full name">
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="clientPhone" placeholder="(555) 555-5555">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Email</label>
          <input type="text" id="clientEmail" placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Stage</label>
          <select id="clientStage"></select>
        </div>
      </div>
      <div class="form-group">
        <label>Address</label>
        <input type="text" id="clientAddress" placeholder="123 Main St, City, FL 32100">
      </div>
      <div class="form-group">
        <label>Source</label>
        <input type="text" id="clientSource" placeholder="How did they find us? (referral, cold call, etc.)">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="clientNotes" placeholder="Additional notes..."></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" onclick="closeModal('clientModal')">Cancel</button>
        <button class="btn btn-primary" onclick="saveClient()">Save Client</button>
      </div>
    </div>
  </div>
  
  <!-- Client Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal" style="width:700px">
      <div id="clientDetail"></div>
    </div>
  </div>

  <script>
    let clients = [];
    let stages = [];
    let activityTypes = [];
    let activeStageFilter = '';
    
    const ICONS = { Call: '📞', Email: '📧', Text: '💬', Showing: '🏠', Meeting: '🤝', Note: '📝', 'Follow-up': '🔔' };
    
    async function init() {
      const [c, s, a] = await Promise.all([
        fetch('/api/clients').then(r => r.json()),
        fetch('/api/stages').then(r => r.json()),
        fetch('/api/activity-types').then(r => r.json())
      ]);
      clients = c; stages = s; activityTypes = a;
      
      // Populate stage filter
      const sf = document.getElementById('stageFilter');
      sf.innerHTML = '<option value="">All Stages</option>' + stages.map(s => `<option value="${s}">${s}</option>`).join('');
      
      // Populate stage select in modal
      const cs = document.getElementById('clientStage');
      cs.innerHTML = stages.map(s => `<option value="${s}">${s}</option>`).join('');
      
      renderPipeline();
      renderClients();
      renderStats();
    }
    
    function renderStats() {
      const stats = document.getElementById('headerStats');
      const total = clients.length;
      const now = new Date();
      const thirtyDaysAgo = new Date(now - 30*24*60*60*1000);
      const needsFollow = clients.filter(c => {
        if (!c.lastContactDate) return true;
        return new Date(c.lastContactDate) < thirtyDaysAgo;
      }).length;
      const active = clients.filter(c => c.stage.includes('Active') || c.stage === 'Under Contract').length;
      
      stats.innerHTML = `
        <div class="header-stat"><div class="num">${total}</div><div class="label">Total Clients</div></div>
        <div class="header-stat"><div class="num">${active}</div><div class="label">Active</div></div>
        <div class="header-stat"><div class="num" style="color:${needsFollow > 0 ? '#e74c3c' : '#e8b931'}">${needsFollow}</div><div class="label">Need Follow-up</div></div>
      `;
    }
    
    function renderPipeline() {
      const p = document.getElementById('pipeline');
      const counts = {};
      stages.forEach(s => counts[s] = 0);
      clients.forEach(c => { if (counts[c.stage] !== undefined) counts[c.stage]++; });
      
      p.innerHTML = `<div class="pipeline-stage ${activeStageFilter === '' ? 'active' : ''}" onclick="filterStage('')">All<span class="count">${clients.length}</span></div>` +
        stages.map(s => `<div class="pipeline-stage ${activeStageFilter === s ? 'active' : ''}" onclick="filterStage('${s}')">${s}<span class="count">${counts[s]}</span></div>`).join('');
    }
    
    function filterStage(stage) {
      activeStageFilter = stage;
      document.getElementById('stageFilter').value = stage;
      renderPipeline();
      renderClients();
    }
    
    function renderClients() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const stageF = activeStageFilter || document.getElementById('stageFilter').value;
      const sortBy = document.getElementById('sortBy').value;
      
      let filtered = clients.filter(c => {
        const matchSearch = !search || c.name.toLowerCase().includes(search) || c.email.toLowerCase().includes(search) || c.phone.includes(search) || c.address.toLowerCase().includes(search);
        const matchStage = !stageF || c.stage === stageF;
        return matchSearch && matchStage;
      });
      
      filtered.sort((a, b) => {
        switch (sortBy) {
          case 'name': return a.name.localeCompare(b.name);
          case 'lastContact': return (b.lastContactDate || '').localeCompare(a.lastContactDate || '');
          case 'stage': return stages.indexOf(a.stage) - stages.indexOf(b.stage);
          case 'created': return b.createdAt.localeCompare(a.createdAt);
          default: return 0;
        }
      });
      
      const table = document.getElementById('clientTable');
      if (filtered.length === 0) {
        table.innerHTML = `<div class="no-clients"><h3>No clients found</h3><p>${clients.length === 0 ? 'Add your first client to get started!' : 'Try adjusting your search or filters.'}</p></div>`;
        return;
      }
      
      const now = new Date();
      const thirtyDaysAgo = new Date(now - 30*24*60*60*1000);
      
      table.innerHTML = `<table>
        <thead><tr>
          <th>Name</th><th>Phone</th><th>Email</th><th>Stage</th><th>Last Contact</th><th>Status</th>
        </tr></thead>
        <tbody>${filtered.map(c => {
          const stageClass = 'stage-' + c.stage.replace(/\s/g, '-');
          const lastContact = c.lastContactDate ? new Date(c.lastContactDate) : null;
          const needsFollow = !lastContact || lastContact < thirtyDaysAgo;
          const lastStr = lastContact ? timeAgo(lastContact) : 'Never';
          
          return `<tr onclick="openDetail('${c.id}')">
            <td class="client-name">${esc(c.name)}</td>
            <td>${esc(c.phone)}</td>
            <td>${esc(c.email)}</td>
            <td><span class="stage-badge ${stageClass}">${c.stage}</span></td>
            <td>${lastStr}</td>
            <td>${needsFollow ? '<span class="follow-up-flag">⚠️ Follow up</span>' : '✅'}</td>
          </tr>`;
        }).join('')}</tbody></table>`;
    }
    
    function timeAgo(date) {
      const diff = Date.now() - date.getTime();
      const days = Math.floor(diff / (1000*60*60*24));
      if (days === 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 30) return days + ' days ago';
      if (days < 365) return Math.floor(days/30) + ' months ago';
      return Math.floor(days/365) + ' years ago';
    }
    
    function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
    
    function openAddModal() {
      document.getElementById('modalTitle').textContent = 'Add Client';
      document.getElementById('editClientId').value = '';
      document.getElementById('clientName').value = '';
      document.getElementById('clientPhone').value = '';
      document.getElementById('clientEmail').value = '';
      document.getElementById('clientStage').value = 'Lead';
      document.getElementById('clientAddress').value = '';
      document.getElementById('clientSource').value = '';
      document.getElementById('clientNotes').value = '';
      document.getElementById('clientModal').classList.add('show');
    }
    
    function openEditModal(id) {
      const c = clients.find(x => x.id === id);
      if (!c) return;
      document.getElementById('modalTitle').textContent = 'Edit Client';
      document.getElementById('editClientId').value = c.id;
      document.getElementById('clientName').value = c.name;
      document.getElementById('clientPhone').value = c.phone;
      document.getElementById('clientEmail').value = c.email;
      document.getElementById('clientStage').value = c.stage;
      document.getElementById('clientAddress').value = c.address;
      document.getElementById('clientSource').value = c.source;
      document.getElementById('clientNotes').value = c.notes;
      closeModal('detailModal');
      document.getElementById('clientModal').classList.add('show');
    }
    
    function closeModal(id) { document.getElementById(id).classList.remove('show'); }
    
    async function saveClient() {
      const id = document.getElementById('editClientId').value;
      const body = {
        name: document.getElementById('clientName').value,
        phone: document.getElementById('clientPhone').value,
        email: document.getElementById('clientEmail').value,
        stage: document.getElementById('clientStage').value,
        address: document.getElementById('clientAddress').value,
        source: document.getElementById('clientSource').value,
        notes: document.getElementById('clientNotes').value
      };
      
      if (id) {
        await fetch(`/api/clients/${id}`, { method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      } else {
        await fetch('/api/clients', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
      }
      
      closeModal('clientModal');
      clients = await fetch('/api/clients').then(r => r.json());
      renderPipeline();
      renderClients();
      renderStats();
    }
    
    async function deleteClient(id) {
      if (!confirm('Are you sure you want to delete this client?')) return;
      await fetch(`/api/clients/${id}`, { method: 'DELETE' });
      closeModal('detailModal');
      clients = await fetch('/api/clients').then(r => r.json());
      renderPipeline();
      renderClients();
      renderStats();
    }
    
    async function openDetail(id) {
      const c = clients.find(x => x.id === id);
      if (!c) return;
      
      const detail = document.getElementById('clientDetail');
      const stageClass = 'stage-' + c.stage.replace(/\s/g, '-');
      
      detail.innerHTML = `
        <div class="detail-header">
          <div>
            <h2>${esc(c.name)}</h2>
            <span class="stage-badge ${stageClass}">${c.stage}</span>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn btn-sm btn-outline" onclick="openEditModal('${c.id}')">✏️ Edit</button>
            <button class="btn btn-sm btn-danger" onclick="deleteClient('${c.id}')">🗑 Delete</button>
            <button class="btn btn-sm btn-outline" onclick="closeModal('detailModal')">✕</button>
          </div>
        </div>
        <div class="detail-info">
          <div class="info-item"><div class="info-label">Phone</div>${esc(c.phone) || '—'}</div>
          <div class="info-item"><div class="info-label">Email</div>${esc(c.email) || '—'}</div>
          <div class="info-item"><div class="info-label">Address</div>${esc(c.address) || '—'}</div>
          <div class="info-item"><div class="info-label">Source</div>${esc(c.source) || '—'}</div>
        </div>
        ${c.notes ? `<div style="margin-bottom:16px;padding:12px;background:#f8f9fa;border-radius:8px;font-size:14px"><strong>Notes:</strong> ${esc(c.notes)}</div>` : ''}
        <div class="activity-section">
          <h3>Activity Log</h3>
          <div class="activity-form">
            <select id="actType">${activityTypes.map(t => `<option value="${t}">${t}</option>`).join('')}</select>
            <input type="text" id="actDesc" placeholder="What happened?" onkeydown="if(event.key==='Enter')addActivity('${c.id}')">
            <button class="btn btn-sm btn-primary" onclick="addActivity('${c.id}')">+ Log</button>
          </div>
          <div id="activityFeed">
            ${(c.activities || []).map(a => `
              <div class="activity-item">
                <div class="activity-icon ${a.type}">${ICONS[a.type] || '📋'}</div>
                <div class="activity-content">
                  <div class="type">${a.type}</div>
                  <div class="desc">${esc(a.description)}</div>
                  <div class="date">${new Date(a.date).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' })}</div>
                </div>
                <div class="activity-delete" onclick="event.stopPropagation();deleteActivity('${c.id}','${a.id}')">✕</div>
              </div>
            `).join('') || '<div style="color:#999;padding:20px 0;text-align:center">No activities yet. Log your first interaction above.</div>'}
          </div>
        </div>
      `;
      
      document.getElementById('detailModal').classList.add('show');
    }
    
    async function addActivity(clientId) {
      const type = document.getElementById('actType').value;
      const desc = document.getElementById('actDesc').value;
      if (!desc) return;
      
      await fetch(`/api/clients/${clientId}/activities`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ type, description: desc })
      });
      
      document.getElementById('actDesc').value = '';
      clients = await fetch('/api/clients').then(r => r.json());
      openDetail(clientId);
      renderClients();
      renderStats();
    }
    
    async function deleteActivity(clientId, actId) {
      await fetch(`/api/clients/${clientId}/activities/${actId}`, { method: 'DELETE' });
      clients = await fetch('/api/clients').then(r => r.json());
      openDetail(clientId);
      renderClients();
    }
    
    // Close modals on overlay click
    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('show');
      });
    });
    
    init();
  </script>
</body>
</html>
